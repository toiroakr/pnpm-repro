name: exclude-prune repro

# Checks out the `exclude-prune` branch's repro.sh and runs it against a
# matrix of pnpm versions. repro.sh exits non-zero when the bug reproduces
# (minimumReleaseAgeExclude wasn't pruned), so this job is red on a buggy
# pnpm version and green on a fixed one -- no separate assertion step needed.
#
# The pnpm versions below are pinned exactly (not a range) so Renovate keeps
# bumping the 12.x entry as new patch releases ship. Once that bump makes
# this job green, the fix has landed upstream and this case can be deleted.
#
# `repro-fixed` builds pnpm from the `exclude-prune` branch's `pnpm-fix`
# submodule (toiroakr/pnpm@fix/exclude-prune, not yet sent upstream) and
# runs the same repro.sh against it, confirming the fix actually works
# before it's proposed to pnpm/pnpm.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pnpm-version:
          - "11.22.0" # expected to pass
          - "12.3.4" # expected to fail until pnpm fixes the regression
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exclude-prune

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}

      - run: ./repro.sh

  repro-fixed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exclude-prune
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pnpm-fix -> target

      - name: Build patched pnpm
        working-directory: pnpm-fix
        run: cargo build --release -p pnpm-cli

      - name: Put the patched pnpm first on PATH
        run: echo "${{ github.workspace }}/pnpm-fix/target/release" >> "$GITHUB_PATH"

      - run: ./repro.sh
